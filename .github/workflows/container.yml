name: container

# Builds the stand-alone application container, smoke-tests it, and publishes it to
# ghcr.io. This runs on GitHub's runners, so no local Docker installation is needed.
#
#   - manual run: Actions -> container -> Run workflow (set version / whether to build the
#     full target / whether to publish)
#   - tag run:    push a tag like v<version> and the version is taken from the tag
#
# Images produced:
#   ghcr.io/<owner>/targetdesign-workbench:<version>         default image (core target)
#   ghcr.io/<owner>/targetdesign-workbench:latest
#   ghcr.io/<owner>/targetdesign-workbench:<version>-full    adds ViennaRNA, Cas-OFFinder,
#                                                            R + NuPoP and a CPU PyTorch build
#
# The workflow builds on GitHub runners. Package visibility is controlled separately in
# the GHCR package settings; it does not automatically follow repository visibility
# (see docs/CONTAINER.md).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (leave blank to use pyproject.toml project.version)"
        required: false
        default: ""
      build_full:
        description: "Also build the full target (ViennaRNA, Cas-OFFinder, R + NuPoP, CPU torch)"
        type: boolean
        default: true
      publish:
        description: "Push the verified images to ghcr.io"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Resolve the image reference and the version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${REQUESTED_VERSION:-}" ]; then
            VERSION="${REQUESTED_VERSION}"
          else
            if ! VERSION="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"; then
              echo "::error::Unable to read [project].version from pyproject.toml"
              exit 1
            fi
          fi
          if [ -z "${VERSION}" ]; then
            echo "::error::Image version is empty; set the workflow input or pyproject.toml [project].version"
            exit 1
          fi
          case "${VERSION}" in
            *[!A-Za-z0-9._-]*)
              echo "::error::Invalid image version '${VERSION}'; use only A-Z, a-z, 0-9, '.', '_' or '-'"
              exit 1
              ;;
          esac
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Check the requirements against the imports
        run: |
          set -euo pipefail
          # Static scan: fails if a hard import is undeclared, or if a module of
          # this program is imported but not tracked by git - the two ways a clone
          # can differ from a working copy (see tools/dep_scan.py).
          python3 tools/dep_scan.py --check

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the default image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          target: core
          load: true
          tags: tdb-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image can import the workbench modules
        run: |
          set -euo pipefail
          # Fails in a few seconds with the missing module name instead of a 60 s
          # HTTP timeout; this is how the absent shared/output package first showed up.
          docker run --rm --entrypoint python tdb-core:ci -c "import sys; sys.path[:0] = ['/app/shared', '/app/webapp']; import jobs, schema, services.batch, services.dataprep, services.designer, services.models; import output.candidate_export, output.output_columns, output.xlsx_utils; print('workbench modules import cleanly')"

      - name: Smoke test the default image
        run: |
          set -euo pipefail
          docker run -d --name tdb-core -p 127.0.0.1:5000:5000 tdb-core:ci
          code=""
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/ || true)
            if [ "$code" = "200" ]; then
              echo "web workbench answered HTTP 200 on attempt ${attempt}"
              break
            fi
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "::error::web workbench did not answer HTTP 200 (last code: ${code})"
            docker logs tdb-core || true
            exit 1
          fi
          echo "static assets:"
          curl -s -o /dev/null -w '  /static/styles.css -> %{http_code}\n' http://127.0.0.1:5000/static/styles.css
          curl -s -o /dev/null -w '  /static/app.js     -> %{http_code}\n' http://127.0.0.1:5000/static/app.js
          echo "native engine:"
          docker exec -w /app tdb-core native/bin/offtarget-engine --version
          echo "sample data dry run:"
          docker exec -w /app tdb-core python tools/batch_run.py --spec sample_data/demo_batch.json --dry-run
          echo "server log:"
          docker logs tdb-core | tail -5
          docker rm -f tdb-core

      - name: Log in to ghcr.io
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the default image
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: core
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

      - name: Build the full image locally for verification
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.build_full }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          load: true
          tags: tdb-full:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the full image
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.build_full }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash tdb-full:ci -lc '
            set -euo pipefail
            python -c "import torch, RNA; print(\"torch\", torch.__version__)"
            command -v RNAfold
            command -v cas-offinder
            command -v Rscript
            Rscript -e "library(NuPoP); cat(\"NuPoP available\n\")"
          '

      - name: Publish the full image
        if: ${{ github.event_name == 'push' || (inputs.publish && inputs.build_full) }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-full
          cache-from: type=gha

      - name: Summarise the images
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' | grep -E 'tdb-core|ghcr' || true
