<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="941" height="388" viewBox="0 0 941 388" role="img" aria-labelledby="gaTitle gaDesc">
  <title id="gaTitle">Graphical abstract draft for CRISPR-Motif Workbench</title>
  <desc id="gaDesc">Draft three-panel graphical abstract: express the design intent, enumerate the design space, rank and use the results. Internal draft, not final artwork.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .t1 { font-family: "Segoe UI", Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #1f3b73; }
      .t2 { font-family: "Segoe UI", Arial, sans-serif; font-size: 12.5px; fill: #475569; }
      .h  { font-family: "Segoe UI", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .b  { font-family: "Segoe UI", Arial, sans-serif; font-size: 11.5px; fill: #1e293b; }
      .s  { font-family: "Segoe UI", Arial, sans-serif; font-size: 9.5px; fill: #64748b; }
      .chip { font-family: "Segoe UI", Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #2f7d6f; }
      .cap { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1f3b73; }
      .note { font-family: "Segoe UI", Arial, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .head { fill: #1f3b73; }
      .headAlt { fill: #2f7d6f; }
      .band { fill: #f1f5f9; }
      .glyphBox { fill: #1f3b73; fill-opacity: 0.12; stroke: #1f3b73; stroke-width: 1.2; }
      .glyphBoxAccent { fill: #c2410c; fill-opacity: 0.12; stroke: #c2410c; stroke-width: 1.2; }
      .glyphText { font-family: "Segoe UI", Arial, sans-serif; font-size: 9.5px; font-weight: 700; fill: #1f3b73; }
      .glyphTextAccent { font-family: "Segoe UI", Arial, sans-serif; font-size: 9.5px; font-weight: 700; fill: #c2410c; }
      .chipBox { fill: #2f7d6f; fill-opacity: 0.12; stroke: #2f7d6f; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="band" x="0" y="0" width="941" height="54"/>
  <rect x="0" y="0" width="6" height="54" fill="#1f3b73"/>
  <text class="t1" x="24" y="27">CRISPR-Motif Workbench</text>
  <text class="t2" x="24" y="45">Motif-anchored guide layout specification, with complete enumeration</text>
  <text class="note" x="921" y="24" text-anchor="end">Graphical abstract - internal draft</text>

  <rect class="panel" x="22" y="72" width="278" height="236" rx="10"/>
  <rect class="head" x="22" y="72" width="278" height="30" rx="10"/>
  <rect class="head" x="22" y="92" width="278" height="10"/>
  <text class="h" x="36" y="93">1  Express the design intent</text>
  <text class="b" x="36" y="130">IUPAC motif anchors</text>
  <text class="b" x="36" y="152">Free-text PAM / TAM</text>
  <text class="b" x="36" y="174">Guide length</text>
  <text class="b" x="36" y="196">Strand orientation</text>
  <text class="b" x="36" y="218">Independent left and right</text>
  <text class="b" x="36" y="240">distance ranges</text>
  <line x1="36" y1="278" x2="272" y2="278" stroke="#94a3b8" stroke-width="2"/>
  <rect class="glyphBox" x="44" y="266" width="34" height="22" rx="5"/>
  <text class="glyphText" x="61" y="281" text-anchor="middle">NGG</text>
  <rect class="glyphBoxAccent" x="126" y="264" width="46" height="26" rx="5"/>
  <text class="glyphTextAccent" x="149" y="281" text-anchor="middle">Y</text>
  <rect class="glyphBox" x="220" y="266" width="34" height="22" rx="5"/>
  <text class="glyphText" x="237" y="281" text-anchor="middle">NGG</text>
  <text class="s" x="36" y="300">x in [x_min, x_max] ; y in [y_min, y_max]</text>

  <line x1="306" y1="190" x2="336" y2="190" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="626" y1="190" x2="656" y2="190" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect class="panel" x="342" y="72" width="278" height="236" rx="10"/>
  <rect class="head" x="342" y="72" width="278" height="30" rx="10"/>
  <rect class="head" x="342" y="92" width="278" height="10"/>
  <text class="h" x="356" y="93">2  Enumerate the design space</text>
  <text class="b" x="356" y="130">Every genomic motif occurrence</text>
  <text class="b" x="356" y="152">Four chain combinations</text>
  <rect class="chipBox" x="356" y="162" width="46" height="22" rx="5"/>
  <text class="chip" x="379" y="177" text-anchor="middle">++</text>
  <rect class="chipBox" x="408" y="162" width="46" height="22" rx="5"/>
  <text class="chip" x="431" y="177" text-anchor="middle">+-</text>
  <rect class="chipBox" x="460" y="162" width="46" height="22" rx="5"/>
  <text class="chip" x="483" y="177" text-anchor="middle">-+</text>
  <rect class="chipBox" x="512" y="162" width="46" height="22" rx="5"/>
  <text class="chip" x="535" y="177" text-anchor="middle">--</text>
  <text class="b" x="356" y="212">Three-element layout</text>
  <text class="b" x="356" y="234">Seed plan synthesized at runtime</text>
  <text class="b" x="356" y="256">Completeness flag reported</text>
  <text class="b" x="356" y="278">Thread-independent hit order</text>

  <rect class="panel" x="662" y="72" width="257" height="236" rx="10"/>
  <rect class="headAlt" x="662" y="72" width="257" height="30" rx="10"/>
  <rect class="headAlt" x="662" y="92" width="257" height="10"/>
  <text class="h" x="676" y="93">3  Rank and use</text>
  <text class="b" x="676" y="130">Candidate and paired layouts</text>
  <text class="b" x="676" y="152">Ranking with explicit</text>
  <text class="b" x="676" y="174">calibration status</text>
  <line x1="676" y1="196" x2="905" y2="196" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="b" x="676" y="222">Desktop interface</text>
  <text class="b" x="676" y="244">Local web interface</text>
  <text class="b" x="676" y="266">Test suite</text>
  <text class="s" x="676" y="290">PairRank: conservative bounds</text>

  <text class="cap" x="470" y="340" text-anchor="middle">Motif-anchored design space, completely enumerated</text>
  <text class="note" x="470" y="362" text-anchor="middle">Computational tool: no experimental validation was performed in this study</text>
  <text class="note" x="921" y="362" text-anchor="end">Draft - not final artwork</text>
</svg>
